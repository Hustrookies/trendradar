<!doctype html><html lang="zh"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{TITLE}}</title>
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESC}}">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://hustrookies.github.io/trendradar/cover.png">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="referrer" content="no-referrer">
  <style>
    :root{
      color-scheme:dark;
      --bg:#080c17; --bg2:#0d1424;
      --card:#111a2e; --card-brd:rgba(56,189,248,.14);
      --ink:#e6eefb; --sub:#8698b9; --faint:#5a6a8a;
      --cyan:#22d3ee; --blue:#3b82f6; --sky:#38bdf8;
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{
      margin:0;color:var(--ink);
      font:16px/1.7 -apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%,rgba(59,130,246,.18),transparent 60%),
        radial-gradient(900px 500px at 90% 10%,rgba(34,211,238,.10),transparent 55%),
        linear-gradient(180deg,var(--bg2),var(--bg) 40%);
      background-attachment:fixed;min-height:100vh;
    }
    .wrap{max-width:680px;margin:0 auto;padding:26px 16px 48px}

    header{margin-bottom:22px}
    .kicker{
      display:inline-flex;align-items:center;gap:6px;
      font-size:12px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--sky);font-weight:700;margin-bottom:10px;
    }
    .kicker::before{content:"";width:8px;height:8px;border-radius:50%;
      background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
    h1{
      font-size:24px;line-height:1.3;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;
      background:linear-gradient(92deg,var(--cyan),var(--sky) 45%,var(--blue));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .meta{color:var(--sub);font-size:13.5px}
    .rule{height:1px;margin:18px 0 4px;
      background:linear-gradient(90deg,transparent,rgba(56,189,248,.4),transparent)}

    .group{
      display:flex;align-items:center;gap:9px;
      margin:26px 0 12px;font-size:15px;font-weight:700;color:#cfe6ff;letter-spacing:.01em;
    }
    .group::before{content:"";width:4px;height:17px;border-radius:3px;
      background:linear-gradient(180deg,var(--cyan),var(--blue));box-shadow:0 0 8px rgba(34,211,238,.5)}

    .card{
      position:relative;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));
      background-color:var(--card);
      border:1px solid var(--card-brd);border-radius:14px;
      padding:13px 15px;margin:9px 0;
      box-shadow:0 4px 18px rgba(0,0,0,.35);
      transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
    }
    .card:active{transform:scale(.99)}
    .card:hover{border-color:rgba(34,211,238,.45);box-shadow:0 6px 24px rgba(34,211,238,.12)}
    .card a{
      color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px;
      display:flex;align-items:flex-start;gap:8px;
    }
    .card a::after{content:"›";margin-left:auto;color:var(--sky);font-size:20px;line-height:1.2;flex:none;opacity:.7}
    .badge{
      display:inline-block;font-size:11.5px;font-weight:600;line-height:1.6;
      color:#9fe9f7;background:rgba(34,211,238,.12);
      border:1px solid rgba(34,211,238,.22);border-radius:999px;
      padding:1px 9px;margin-right:2px;white-space:nowrap;flex:none;
    }
    /* 双语卡片：中文主标题 + 原文副标题（换行显示） */
    .card a{flex-wrap:wrap}
    .card .t-main{flex:1 1 auto}
    .card .t-sub{flex:0 0 100%;font-size:13px;color:var(--sub);font-weight:400;line-height:1.5;margin-top:2px}

    footer{margin-top:34px;padding-top:16px;text-align:center;color:var(--faint);font-size:12px;
      border-top:1px solid rgba(255,255,255,.06)}
  </style></head>
  <body><div class="wrap">
    <header>
      <div class="kicker">TREND RADAR · 热点速览</div>
      <h1>{{TITLE}}</h1>
      <div class="meta">{{DESC}}</div>
      <div class="rule"></div>
    </header>
    {{CONTENT}}
    <footer>个人自用 · 由 TrendRadar + OpenClaw 自动生成</footer>
  </div></body></html>
