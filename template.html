<!doctype html><html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:type" content="article">
<meta property="og:image" content="https://hustrookies.github.io/trendradar/cover.png">
<meta name="referrer" content="no-referrer">
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.7 -apple-system,system-ui,"PingFang SC",sans-serif;background:#f6f7f9;color:#1a1a1a}
  @media(prefers-color-scheme:dark){body{background:#111;color:#eee}}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:21px;margin:0 0 4px}
  .meta{color:#888;font-size:13px;margin-bottom:18px}
  .group{margin:24px 0 10px;font-size:15px;font-weight:600;color:#c0392b;border-left:3px solid #c0392b;padding-left:8px}
  .card{background:#fff;border-radius:12px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  @media(prefers-color-scheme:dark){.card{background:#1c1c1e}}
  .card a{color:inherit;text-decoration:none;font-weight:500;display:block}
  .badge{display:inline-block;font-size:12px;color:#888;margin-right:6px}
  footer{margin-top:30px;text-align:center;color:#aaa;font-size:12px}
</style></head>
<body><div class="wrap">
  <h1>{{TITLE}}</h1>
  <div class="meta">{{DESC}}</div>
  {{CONTENT}}
  <footer>个人自用 · 由 TrendRadar + OpenClaw 自动生成</footer>
</div></body></html>
